<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icarus Atlas — Theme B: Aether Nebula</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Inter:wght@400;500&display=swap">
<style>
  :root {
    --c-primordial: #c084fc;
    --c-titan: #fb7185;
    --c-olympian: #fcd34d;
    --c-god: #60a5fa;
    --c-hero: #2dd4bf;
    --c-nymph: #4ade80;
    --c-mortal: #e5e7eb;
    --c-creature: #f472b6;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    height: 100vh; overflow: hidden; font-family: Inter, sans-serif; color: #f1f5f9;
    background: #08041d;
    background-image:
      radial-gradient(42% 36% at 72% 16%, rgba(124,77,255,.3), transparent 70%),
      radial-gradient(48% 42% at 16% 78%, rgba(0,229,255,.13), transparent 70%),
      radial-gradient(36% 32% at 88% 82%, rgba(255,64,129,.16), transparent 70%),
      radial-gradient(30% 26% at 40% 40%, rgba(124,77,255,.12), transparent 70%);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    height: 58px; padding: 0 18px; position: relative; z-index: 30;
    background: rgba(255,255,255,.045); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,.09);
  }
  .brand { display: flex; align-items: center; gap: 9px; font: 600 14px Sora, sans-serif; letter-spacing: .18em; }
  .brand i { width: 9px; height: 9px; border-radius: 50%; background: #c084fc; box-shadow: 0 0 10px #c084fc; }
  .lens { display: flex; gap: 4px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
  .lens button {
    background: none; border: 1px solid transparent; cursor: pointer; border-radius: 999px;
    padding: 5px 13px; font: 500 12.5px Inter, sans-serif; color: rgba(226,232,240,.6);
  }
  .lens button.active { background: rgba(192,132,252,.25); color: #e9d5ff; border-color: rgba(192,132,252,.5); }
  .search { display: flex; align-items: center; gap: 6px; color: rgba(226,232,240,.5); font-size: 12.5px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: 7px 13px; }
  #stage { position: absolute; inset: 58px 0 0 0; overflow: hidden; }
  #world { position: absolute; inset: 0; transition: transform .95s cubic-bezier(.22,.9,.3,1); }
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .star {
    position: absolute; transform: translate(-50%,-50%); border-radius: 50%;
    background: var(--c); cursor: pointer; transition: transform .25s;
    box-shadow: 0 0 10px 3px var(--c), 0 0 30px 9px color-mix(in srgb, var(--c) 45%, transparent);
    animation: tw 3.2s ease-in-out infinite;
  }
  .star:nth-child(2n) { animation-delay: -1.1s; }
  .star:nth-child(3n) { animation-delay: -2.3s; }
  .star:hover { transform: translate(-50%,-50%) scale(1.6); }
  .star.selected { outline: 2px solid rgba(252,211,77,.65); outline-offset: 5px; }
  .star span {
    position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    font: 500 11px Inter, sans-serif; letter-spacing: .04em;
    color: rgba(226,232,240,.7); white-space: nowrap; pointer-events: none;
  }
  @keyframes tw { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  #card {
    position: absolute; top: 14px; right: 14px; width: 270px; z-index: 20;
    background: rgba(20,12,48,.55); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.16); border-radius: 16px;
    padding: 16px 18px 13px; display: none;
  }
  #card.visible { display: block; }
  #card h2 { font: 600 17px Sora, sans-serif; }
  #card .greek { font: 400 13px Inter, sans-serif; color: rgba(226,232,240,.5); margin-left: 5px; }
  #card .meta { display: flex; align-items: center; gap: 7px; margin: 8px 0 9px; flex-wrap: wrap; }
  #card .chip { background: rgba(252,211,77,.16); border: 1px solid rgba(252,211,77,.45); border-radius: 999px; padding: 2px 10px; font: 500 11px Inter, sans-serif; color: #fde68a; text-transform: capitalize; }
  #card .domains { font-size: 12px; color: rgba(226,232,240,.55); }
  #card .summary { font-size: 13px; line-height: 1.55; color: rgba(241,245,249,.85); }
  #card .variant {
    display: none; align-items: center; gap: 7px; margin: 10px 0; padding: 7px 10px;
    background: rgba(124,77,255,.18); border: 1px solid rgba(192,132,252,.35); border-radius: 10px;
    font-size: 11.5px; color: #e9d5ff;
  }
  #card .variant.visible { display: flex; }
  #card .bonds-title { font: 500 11px Inter, sans-serif; letter-spacing: .1em; color: rgba(226,232,240,.45); margin: 9px 0 6px; }
  #card .bonds { display: flex; flex-wrap: wrap; gap: 5px; }
  #card .bonds span {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 999px;
    padding: 3px 9px; font-size: 11.5px; color: rgba(241,245,249,.85);
  }
  #card footer { margin-top: 11px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.1); font: 500 12px Inter, sans-serif; color: #a5b4fc; }
  #back {
    position: absolute; top: 14px; left: 14px; z-index: 20; display: none; cursor: pointer;
    background: rgba(20,12,48,.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px; padding: 8px 16px; font: 500 12px Inter, sans-serif; color: #e9d5ff;
  }
  #back.visible { display: block; }
  #legend {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: center; gap: 14px; padding: 10px 8px 9px;
    background: linear-gradient(transparent, rgba(8,4,29,.92));
    font: 500 11px Inter, sans-serif; color: rgba(226,232,240,.65); text-transform: capitalize;
  }
  #legend b { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 7px currentcolor; }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>ICARUS ATLAS</div>
  <div class="lens" id="lens">
    <button data-lens="hesiod" class="active">Hesiod</button>
    <button data-lens="homer">Homer</button>
    <button data-lens="consensus">Consensus</button>
  </div>
  <div class="search">Search ⌘K</div>
</header>
<div id="stage">
  <div id="world">
    <svg id="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    <div id="stars"></div>
  </div>
  <aside id="card"></aside>
  <button id="back">← Back to the galaxy</button>
  <div id="legend"></div>
</div>
<script src="shared/atlas-data.js"></script>
<script>
  AtlasMockup.init({
    typeColorVar: t => `var(--c-${t})`,
    lineAccent: '#c084fc',
    travelScale: 2.3,
    travelHint: 'Click to travel →',
    hereHint: 'You have arrived',
    legendItem: (t, c) => `<span><b style="color:${c};background:${c}"></b>${t}</span>`,
    cardTemplate: c => `
      <h2>${c.name}<span class="greek">${c.greek}</span></h2>
      <div class="meta"><span class="chip">${c.type}</span><span class="domains">${c.domains}</span></div>
      <div class="summary">${c.summary}</div>
      <div class="variant ${c.variantNote ? 'visible' : ''}">${c.variantNote || ''}</div>
      <div class="bonds-title">RELATIONS</div>
      <div class="bonds">${c.bonds.map(b => `<span>${b.name} · ${b.label}</span>`).join('')}</div>
      <footer>${c.travelHint}</footer>`
  });
</script>
</body>
</html>
