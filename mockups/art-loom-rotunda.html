<style>
:root {
  --deep: #05020f; --aether: #f1f5f9; --muted: #aab4c8; --faint: #6b7488;
  --gold: #fcd34d; --gold-dim: rgb(252 211 77 / .55);
  --glass: rgb(255 255 255 / .06); --glass-border: rgb(255 255 255 / .14); --glass-heavy: rgb(16 9 40 / .8);
  --display: 'Cinzel', serif; --body: 'Cormorant Garamond', serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); color: var(--aether); font-family: var(--body); -webkit-font-smoothing: antialiased; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#gl.dragging { cursor: grabbing; }
#gl.on-work { cursor: pointer; }

/* masthead, as in AtlasBar */
.bar { position: fixed; inset: 0 0 auto 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 30; pointer-events: none; }
.bar::before { content: ''; position: absolute; inset: 0 0 -34px 0; z-index: -1; background: linear-gradient(rgb(5 2 15 / .78), rgb(5 2 15 / 0)); }
.brand { font-family: var(--display); font-size: 14px; letter-spacing: .22em; color: var(--gold); }
.doors { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid var(--glass-border); background: var(--glass); backdrop-filter: blur(20px); }
.doors span { font-family: var(--display); font-size: 11px; letter-spacing: .16em; color: var(--muted); padding: 6px 16px; border-radius: 999px; border: 1px solid transparent; }
.doors span.on { color: var(--gold); border-color: var(--gold-dim); background: rgb(252 211 77 / .12); }
.meta { font-style: italic; font-size: 14px; color: var(--faint); }

/* the era being read, pinned under the bar */
.era { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; align-items: baseline; gap: 10px; padding: 7px 18px; border-radius: 999px; border: 1px solid var(--glass-border); background: rgb(8 4 29 / .55); backdrop-filter: blur(14px); pointer-events: none; white-space: nowrap; }
.era b { font-family: var(--display); font-weight: 400; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.era i { font-size: 16px; color: var(--muted); }

.head { position: fixed; left: 28px; bottom: 28px; width: 250px; z-index: 12; pointer-events: none; transition: opacity .4s ease; }
.head h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 25px; letter-spacing: .14em; }
.head p { margin: 9px 0 0; font-size: 16px; line-height: 1.32; color: var(--muted); }
.head p em { color: var(--aether); }

.dock { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.dock .buttons { display: flex; gap: 8px; }
.dock button { font-family: var(--display); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--aether); background: var(--glass); border: 1px solid var(--glass-border); border-radius: 999px; padding: 10px 20px; cursor: pointer; backdrop-filter: blur(16px); transition: border-color .2s, color .2s, background .2s; }
.dock button:hover { border-color: var(--gold-dim); color: var(--gold); }
.dock button.primary { color: var(--gold); border-color: var(--gold-dim); background: rgb(252 211 77 / .1); }
.dock button[hidden] { display: none; }
.hint { margin: 0; padding: 3px 14px 4px; border-radius: 999px; background: rgb(5 2 15 / .62); backdrop-filter: blur(10px); font-style: italic; font-size: 16px; color: var(--muted); text-align: center; max-width: 720px; }
.hint:empty { display: none; }
/* the lens and where you stand, inside only */
.optics { display: flex; align-items: center; gap: 10px; padding: 5px 8px 5px 16px; border-radius: 999px; border: 1px solid var(--glass-border); background: rgb(8 4 29 / .6); backdrop-filter: blur(14px); font-family: var(--display); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
.optics[hidden] { display: none; }
.optics input[type=range] { width: 150px; accent-color: #fcd34d; cursor: pointer; }
.optics output { min-width: 30px; color: var(--gold); font-variant-numeric: tabular-nums; }
.dock .optics .stance button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 999px; padding: 5px 11px; }
.dock .optics .stance button.on { color: var(--gold); border-color: var(--gold-dim); background: rgb(252 211 77 / .1); }

.rail { position: fixed; right: 24px; top: 92px; width: 272px; z-index: 20; padding: 16px 18px 14px; border-radius: 16px; border: 1px solid var(--glass-border); background: var(--glass-heavy); backdrop-filter: blur(18px); transition: opacity .35s ease, transform .35s ease; }
.rail.hidden { opacity: 0; transform: translateX(12px); pointer-events: none; }
.rail h2 { margin: 0 0 3px; font-family: var(--display); font-weight: 400; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.rail .sub { margin: 0 0 12px; font-size: 15px; font-style: italic; color: var(--faint); }
.rail .title { font-size: 21px; line-height: 1.15; margin: 4px 0 3px; }
.rail .by { font-size: 15px; color: var(--muted); margin: 0 0 12px; }
.rail ul { list-style: none; margin: 0 -6px; padding: 0; max-height: 44vh; overflow-x: hidden; overflow-y: auto; }
.rail li { display: flex; align-items: center; gap: 9px; padding: 5px 6px; border-radius: 8px; font-size: 16px; line-height: 1.2; cursor: pointer; }
.rail li:hover, .rail li.on { background: rgb(255 255 255 / .07); }
.rail .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.rail .n { margin-left: auto; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
.rail .note { margin: 0 0 12px; font-size: 15px; line-height: 1.35; color: var(--muted); }
.rail .link { margin: 12px 0 0; font-family: var(--display); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); cursor: pointer; }

.card { position: fixed; left: 0; top: 0; z-index: 25; max-width: 290px; padding: 10px 14px 11px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-heavy); backdrop-filter: blur(16px); pointer-events: none; opacity: 0; transition: opacity .15s ease; }

.card .k { font-family: var(--display); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }

.card .a { font-size: 14px; color: var(--muted); }

.plate { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgb(5 2 15 / .76); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.plate.on { opacity: 1; pointer-events: auto; }
.plate .sheet { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, 1fr); gap: 36px; width: min(1160px, 92vw); max-height: 86vh; padding: 32px; border-radius: 18px; border: 1px solid var(--glass-border); background: rgb(12 7 32 / .94); }
.plate figure { margin: 0; display: grid; place-items: center; min-height: 0; }
.plate img { max-width: 100%; max-height: 72vh; object-fit: contain; outline: 1px solid rgb(252 211 77 / .75); outline-offset: 7px; box-shadow: 0 0 0 13px rgb(12 7 32), 0 0 0 14px rgb(252 211 77 / .4); }
.plate .text { overflow: auto; min-height: 0; padding-right: 6px; }
.plate .kicker { font-family: var(--display); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.plate h3 { margin: 10px 0 4px; font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: .04em; line-height: 1.2; }
.plate .by { margin: 0 0 14px; font-size: 18px; color: var(--muted); }
.plate .caption { font-size: 18px; line-height: 1.45; margin: 0 0 14px; }
.plate .stars { font-size: 16px; color: var(--muted); margin: 0 0 14px; }
.plate .credit { font-size: 14px; color: var(--faint); }
.plate .credit a { color: var(--muted); }
.plate .close { position: absolute; top: 18px; right: 22px; font-family: var(--display); font-size: 11px; letter-spacing: .2em; color: var(--muted); background: none; border: 0; cursor: pointer; }

.veil { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--deep); transition: opacity .8s ease; }
.veil.gone { opacity: 0; pointer-events: none; }
.veil p { max-width: 660px; padding: 0 24px; text-align: center; font-size: 20px; line-height: 1.55; color: var(--muted); font-style: italic; }
.veil code { font-style: normal; font-size: 14px; color: var(--gold); background: rgb(255 255 255 / .06); padding: 2px 7px; border-radius: 6px; }
</style>

<canvas id="gl"></canvas>
<header class="bar"><span class="brand">ICARUS ATLAS</span><nav class="doors"><span>Galaxy</span><span>Lands</span><span>Myths</span><span class="on">Art</span></nav><span class="meta">mockup · the Loom as a rotunda</span></header>

<script type="module">
import * as THREE from 'three';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

// The Loom as a rotunda (docs/LOOM_PLAN.md is the door's contract). The same cloth,
// with the same layout, hangs flat or closes into a drum around the visitor: across
// it the sagas go round in Spindle order, down it the centuries fall from the beam.
// It reads the baked door from public/art/, so the repository has to be served over
// HTTP (the veil says how when it is not).

const ART = '../public/art/';
const SAGA_LABEL = ['The Primordials', 'The Titans', 'The Olympians', 'The Metamorphoses', 'The Theban Cycle', 'The Dionysus Cycle', 'The Perseus Cycle', 'The Argonautica', 'The Labours of Heracles', 'The Attic Cycle', 'The Trojan Cycle', 'The Returns', 'Other tales'];
const SAGA_HEX = ['#a78bfa', '#e3b341', '#7dd3fc', '#e879f9', '#fb7185', '#c026d3', '#eab308', '#38bdf8', '#f97316', '#2dd4bf', '#fbbf24', '#34d399', '#aab4c8'];
const MEDIUM_LABEL = ['Painting', 'Vase', 'Sculpture', 'Wall painting', 'Print or drawing'];
const TEAR_FROM = 500, TEAR_TO = 1400;
const THUMB_STEPS = [120, 250, 330, 500, 960, 1280, 1920];
const COMMONS = 'https://upload.wikimedia.org/wikipedia/commons';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const unwrapNear = (angle, near) => angle + TAU * Math.round((near - angle) / TAU);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function loadImage(src, cors = false) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    if (cors) img.crossOrigin = 'anonymous';
    img.decoding = 'async';
    // decoded off the main thread now, so cutting it later does not stall a frame
    img.onload = () => img.decode().then(() => resolve(img), () => resolve(img));
    img.onerror = () => reject(new Error(`Could not load ${src}`));
    img.src = src;
  });
}

/** The Commons thumbnail step for a wanted width: the smallest that is wide enough,
 *  or the widest the original allows (Commons never upscales). 0 is the original. */
function stepFor(work, wanted) {
  const steps = THUMB_STEPS.filter((s) => s < work.width);
  return steps.find((s) => s >= wanted) ?? steps[steps.length - 1] ?? 0;
}
function thumbUrl(work, step) {
  const name = encodeURIComponent(work.file);
  if (!step) return `${COMMONS}/${work.path}/${name}`;
  const ext = work.file.toLowerCase().split('.').pop();
  const rendered = ext === 'tif' || ext === 'tiff' ? `lossy-page1-${step}px-${name}.jpg` : ext === 'webp' ? `${step}px-${name}.png` : `${step}px-${name}`;
  return `${COMMONS}/thumb/${work.path}/${name}/${rendered}`;
}

// ---------------------------------------------------------------- the door's data
// The sheets are local, so the cloth is woven once, from the full sheets: a cloth this
// large would stall on a second upload.
let data, sheetLq, sheetImg, anchorsImg;
try {
  [data, sheetLq, sheetImg, anchorsImg] = await Promise.all([
    fetch(ART + 'loom.json').then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); }),
    loadImage(ART + 'sheet-lq.webp'),
    loadImage(ART + 'sheet.webp'),
    loadImage(ART + 'anchors.webp'),
  ]);
} catch {
  $('veilText').innerHTML = 'This mockup reads the baked Loom from <code>public/art/</code>, so the repository has to be served over HTTP. From the repository root run<br><code>python3 -m http.server 4800 --bind 127.0.0.1</code><br>and open <code>http://localhost:4800/mockups/art-loom-rotunda.html</code>';
  throw new Error('The Loom data could not be loaded');
}

// The rotunda hangs the door's works woven 88 columns wide by the Loom's own engine
// (shared/loom-rotunda-layouts.js), so the room is about as tall as it is wide.
// ?width=58 hangs the door's own desktop cloth, a tower twice as tall as it is wide;
// ?width=72 or 104 the other weavings. ?fov= sets the lens inside, in degrees.
const params = new URLSearchParams(location.search);
const rotunda = window.LOOM_ROTUNDA;
const asked = params.get('width') ?? '88';
const fresh = rotunda?.count === data.works.length && rotunda.first === data.works[0][0] && rotunda.last === data.works[data.works.length - 1][0];
if (asked !== '58' && !fresh) console.warn('The rotunda layouts predate this bake; hanging the desktop cloth instead.');
const layout = asked !== '58' && fresh ? rotunda.layouts[asked] ?? rotunda.layouts['88'] : data.desktop;
const W = layout.width, H = layout.height;
const atlas = data.sheet;
const works = data.works.map((row, index) => {
  const [id, title, artist, year, sortYear, saga, medium, path, file, width, height, sprite, anchor, figures] = row;
  return {
    index, id, title, artist, year, sortYear, saga, medium, path, file, width, height, sprite, anchor, figures,
    x: layout.cells[index * 4], row: layout.cells[index * 4 + 1], w: layout.cells[index * 4 + 2], h: layout.cells[index * 4 + 3],
  };
});
const cellOf = new Int32Array(W * H).fill(-1);
for (const w of works) for (let dy = 0; dy < w.h; dy++) for (let dx = 0; dx < w.w; dx++) cellOf[(w.row + dy) * W + w.x + dx] = w.index;

// One thread per figure seen in two works or more, oldest first (features/art/threads.ts).
const byFigure = new Map();
for (const w of works) for (const f of w.figures) byFigure.set(f, [...(byFigure.get(f) ?? []), w.index]);
const threads = [];
for (const [figure, members] of [...byFigure].sort((a, b) => a[0] - b[0])) {
  if (members.length < 2) continue;
  members.sort((a, b) => works[a].sortYear - works[b].sortYear || a - b);
  const tally = new Map();
  for (const m of members) tally.set(works[m].saga, (tally.get(works[m].saga) ?? 0) + 1);
  const saga = [...tally].sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0];
  threads.push({ index: threads.length, figure, name: data.figures[figure][1], works: members, saga });
}
const threadsOf = works.map(() => []);
for (const t of threads) for (const m of t.works) threadsOf[m].push(t.index);
const stitchCount = threads.reduce((n, t) => n + t.works.length - 1, 0);

function eraOf(row) { let era = layout.eras[0]; for (const e of layout.eras) if (e.row <= row) era = e; return era; }

// The saga under each cell, empty ones included, so the bare warp keeps its colour.
const cellSaga = new Int16Array(W * H);
for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) {
  let saga = 0;
  for (let d = 0; d < H; d++) {
    const hit = [y - d, y + d].find((yy) => yy >= 0 && yy < H && cellOf[yy * W + x] >= 0);
    if (hit !== undefined) { saga = works[cellOf[hit * W + x]].saga; break; }
  }
  cellSaga[y * W + x] = saga;
}

// The warp leaves the cloth at its last full row and gathers on one clay weight per saga.
let fullRow = H - 1;
for (let r = H - 1; r >= 0; r--) {
  let n = 0;
  for (let x = 0; x < W; x++) if (cellOf[r * W + x] >= 0) n++;
  if (n >= W * 0.9) { fullRow = r; break; }
}
const bands = [];
for (let x = 0; x < W; x++) {
  const saga = cellSaga[fullRow * W + x];
  const last = bands[bands.length - 1];
  if (last && last.saga === saga) last.x1 = x + 1; else bands.push({ saga, x0: x, x1: x + 1 });
}

// ---------------------------------------------------------------- the stage
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 5000);

/** World units are cells. Closed, the cloth's width is the drum's circumference. */
const R = W / TAU;
const TOP = H / 2, BOTTOM = -H / 2;
const BEAM = [-1.45, -0.85];
const ATTIC = -1.75;
const WEIGHT_TOP = H + 2.2;
const FLOOR_Y = BOTTOM - 6.2;
const FLOOR_ROW = H / 2 - FLOOR_Y;

const U = {
  uBend: { value: 0 }, uCenter: { value: W / 2 }, uR: { value: R }, uW: { value: W }, uH: { value: H },
  uTime: { value: 0 }, uRoom: { value: 0 }, uFloor: { value: FLOOR_Y },
};

/** Flat cell coordinates (column across, row down) to the world, at a bend from 0 (a
 *  flat cloth facing +z) to 1 (a closed drum round the axis x = 0, z = R). The curl
 *  centre stays put; h lifts toward the visitor, so negative h is behind the cloth. */
const BEND = /* glsl */ `
uniform float uBend, uCenter, uR, uW, uH;
vec3 bendAt(vec2 g, float h) {
  float u = g.x - uCenter, v = uH * .5 - g.y;
  if (uBend < 1e-4) return vec3(u, v, h);
  float rho = uR / uBend, t = u / rho, r = rho - h;
  return vec3(r * sin(t), v, rho - r * cos(t));
}`;
function bendAt(gx, gy, h, out = new THREE.Vector3(), b = U.uBend.value) {
  const u = gx - U.uCenter.value, v = H / 2 - gy;
  if (b < 1e-4) return out.set(u, v, h);
  const rho = R / b, t = u / rho, r = rho - h;
  return out.set(r * Math.sin(t), v, rho - r * Math.cos(t));
}
/** The wall's own axes at a column: along the cloth, up, and toward the visitor. */
function wallBasis(gx, b = U.uBend.value) {
  const t = b < 1e-4 ? 0 : (gx - U.uCenter.value) / (R / b);
  return new THREE.Matrix4().makeBasis(new THREE.Vector3(Math.cos(t), 0, Math.sin(t)), new THREE.Vector3(0, 1, 0), new THREE.Vector3(-Math.sin(t), 0, Math.cos(t)));
}

/** A grid over flat cell coordinates; the vertex shaders bend it. */
function gridGeometry(x0, y0, x1, y1, segX, segY, flipV = false) {
  const positions = [], uvs = [], index = [];
  for (let j = 0; j <= segY; j++) for (let i = 0; i <= segX; i++) {
    positions.push(lerp(x0, x1, i / segX), lerp(y0, y1, j / segY), 0);
    uvs.push(i / segX, flipV ? 1 - j / segY : j / segY);
  }
  for (let j = 0; j < segY; j++) for (let i = 0; i < segX; i++) {
    const a = j * (segX + 1) + i, b = a + 1, c = a + segX + 1, d = c + 1;
    index.push(a, c, b, b, c, d);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(index);
  return geometry;
}
function bent(mesh) { mesh.frustumCulled = false; scene.add(mesh); return mesh; }

// ---------------------------------------------------------------- the cloth's textures
/** Pixels a cell in the cloth's own texture: the sprites arrive at 64, the woven Commons
 *  images fill it out. */
const CELL = Math.min(112, Math.floor(renderer.capabilities.maxTextureSize / Math.max(W, H)));
const clothCanvas = document.createElement('canvas');
clothCanvas.width = W * CELL;
clothCanvas.height = H * CELL;
const clothTex = new THREE.CanvasTexture(clothCanvas);
Object.assign(clothTex, { flipY: false, colorSpace: THREE.NoColorSpace, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, anisotropy: Math.min(8, maxAniso) });

/** components/art/loomTextures.ts: every work drawn into one cloth texture. */
function paintCloth(sheet, sheetCell, anchors) {
  const ctx = clothCanvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#05020f';

/** The tear: red marks the gold mend, green the bare gap. Seeded, so it always tears alike. */
function tearTexture() {
  const { tearTop, tearRows } = layout;
  let seed = 7;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const canvasWidth = 2560, scale = canvasWidth / W;
  const c = document.createElement('canvas');

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, c.width, c.height);
  const edge = (base, amplitude) => {
    const points = [];
    let y = 0, velocity = 0;
    for (let i = 0; i <= W * 2; i++) {
      velocity = velocity * 0.72 + (random() - 0.5) * 0.62;

  top.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  [...bottom].reverse().forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.closePath();
  ctx.fill();

    stroke(line, 2.2, 0.95, 9);
    for (let n = 0; n < 7; n++) {
      const start = line[2 + Math.floor(random() * (line.length - 4))];
      const direction = line === top ? -1 : 1;
      const vein = [start];
      let [x, y] = start;
      let bend = (random() - 0.5) * 1.1;
      const length = 2 + Math.floor(random() * 4);
      for (let i = 0; i < length; i++) {
        bend += (random() - 0.5) * 0.9;
        x += Math.sin(bend) * scale * 0.55;
        y += direction * Math.cos(bend) * scale * 0.5;
        vein.push([x, y]);
      }
      stroke(vein, 1.1, 0.6, 4);
    }
  }
  for (let i = 3; i < W; i += 6) stroke([top[i * 2], bottom[i * 2 + 1]], 1.2, 0.7, 4);
  const texture = new THREE.CanvasTexture(c);
  Object.assign(texture, { flipY: false, colorSpace: THREE.NoColorSpace, minFilter: THREE.LinearMipmapLinearFilter });
  return texture;
}

// ---------------------------------------------------------------- the camera

// ---------------------------------------------------------------- the three states

// ---------------------------------------------------------------- input

// ---------------------------------------------------------------- hover
const card = $('card');

function showOptics() {
  $('lens').value = String(lens);
  $('lensOut').textContent = `${lens}°`;
  $('standBack').classList.toggle('on', homeD !== 0);
  $('standCentre').classList.toggle('on', homeD === 0);
}
$('lens').addEventListener('input', () => {
  lens = Number($('lens').value);
  showOptics();
  remember();
});
for (const [id, centre] of [['standBack', false], ['standCentre', true]]) {
  $(id).addEventListener('click', () => {
    homeD = centre ? 0 : R - 2.6;
    S.dGoal = homeD;
    showOptics();
    remember();
  });
}
showOptics();
function readout() {
  const label = $('eraLabel'), sub = $('eraSub');
  if (S.mode === 'outside' || S.mode === 'turning') { label.textContent = 'The back of the cloth'; sub.textContent = `${threads.length} threads, ${stitchCount.toLocaleString('en-US')} stitches`; return; }
  if (S.mode !== 'inside') { label.textContent = 'The Loom'; sub.textContent = `${works.length.toLocaleString('en-US')} works`; return; }
  const hit = hitCloth(0, 0);
  if (!hit || hit.back) return;
  if (hit.gy < 0) { label.textContent = 'The beam'; sub.textContent = 'where the weaving begins'; return; }
  if (hit.gy >= H) { label.textContent = 'The weights'; sub.textContent = 'where the warp ends'; return; }
  const era = eraOf(Math.floor(hit.gy));
  label.textContent = era.label;
  const w = hit.work >= 0 ? works[hit.work] : null;
  sub.textContent = w ? SAGA_LABEL[w.saga] : era.sub;
}

// ---------------------------------------------------------------- the plate
let details = null, plateWork = -1;
async function openPlate(i) {
  plateWork = i;
  const w = works[i];
  details ??= await fetch(ART + 'details.json').then((r) => r.json()).catch(() => ({}));
  if (plateWork !== i) return;
  const d = details[w.id] ?? {};
  const img = $('plateImg');
  img.src = thumbUrl(w, stepFor(w, 1280));
  img.alt = w.title;
  const credit = d.credit
    ? `${esc(d.credit.license)}${d.credit.author ? ` · ${esc(d.credit.author)}` : ''} · <a href="${esc(d.credit.pageUrl)}" target="_blank" rel="noopener">Wikimedia Commons</a>`
    : '';
  $('plateText').innerHTML = `<div class="kicker">${SAGA_LABEL[w.saga]} · ${eraOf(w.row).label} · ${MEDIUM_LABEL[w.medium]}</div><h3>${esc(w.title)}</h3><p class="by">${esc(w.artist)}, ${esc(w.year)}</p>${d.caption ? `<p class="caption">${esc(d.caption)}</p>` : ''}${d.figures?.length ? `<p class="stars">Stars in this work: ${d.figures.map((f) => esc(f.name)).join(', ')}</p>` : ''}<p class="credit">${credit}</p>`;
  $('plate').classList.add('on');
  plateOn = true;
  hideCard();
}
function walkPlate(direction) {
  const order = works.map((w) => w.index).sort((a, b) => works[a].sortYear - works[b].sortYear || a - b);
  const next = order[order.indexOf(plateWork) + direction];
  if (next !== undefined) openPlate(next);
}
function closePlate() {
  $('plate').classList.remove('on');
  plateOn = false;
  plateWork = -1;
}

// ---------------------------------------------------------------- the loop
paintCloth(sheetImg, atlas.cell, anchorsImg);
writeCells();
sheetRef = sheetPixels(sheetImg);
anchorRef = sheetPixels(anchorsImg);
// Compile every shader the room will use now, behind the veil, rather than on first
// use: a first compile stalls a frame for a third of a second. The template materials
// stay alive, so their programs stay cached for the works that use them later.
{
  const templates = [
    new THREE.Mesh(plane, new THREE.ShaderMaterial({ uniforms: { ...U, uLift: { value: 0 }, uTex: { value: clothTex }, uCropOffset: { value: new THREE.Vector2() }, uCropScale: { value: new THREE.Vector2(1, 1) }, uOpacity: { value: 0 }, uBright: { value: 1 } }, vertexShader: HIRES_VS, fragmentShader: HIRES_FS, transparent: true, depthWrite: false })),
    new THREE.Mesh(plane, new THREE.ShaderMaterial({ uniforms: { uTex: { value: clothTex }, uCropOffset: { value: new THREE.Vector2() }, uCropScale: { value: new THREE.Vector2(1, 1) }, uSize: { value: new THREE.Vector2(1, 1) }, uOpacity: { value: 0 }, uHeld: { value: 0 }, uHover: { value: 0 } }, vertexShader: LIFT_VS, fragmentShader: LIFT_FS, transparent: true, side: THREE.DoubleSide })),
  ];
  const hidden = [mirror, webLines, patternLines, backLines, backHot].filter((o) => !o.visible);
  for (const o of hidden) o.visible = true;
  for (const t of templates) scene.add(t);
  renderer.compile(scene, camera);
  for (const t of templates) scene.remove(t);
  for (const o of hidden) o.visible = false;
}
S.pos.copy(flatPose().pos);
renderAll();
let fell = reduce ? H + 1 : 0;
let last = performance.now(), hiresClock = 0, readClock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (plateOn) return;  // reading costs the GPU nothing
  U.uTime.value = reduce ? 0 : now / 1000;
  if (fell <= H + 1) {
    fell += (dt * (H + 1)) / 1.6;
    clothUniforms.uFell.value = fell > H + 1 ? 1e4 : fell;
  }
  if (S.tween) stepTween(dt); else userCamera(dt);
  U.uRoom.value = smooth(0.82, 1, U.uBend.value);
  mirror.visible = U.uRoom.value > 0.01;
  applyCamera();
  animateWeb(dt);
  easeBrightness(dt);
  updateHover();
  if ((hiresClock += dt) > 0.3) { hiresClock = 0; updateSharp(now); }
  pumpSharp();
  flushWoven();
  settleArrivals();
  for (const [i, entry] of fine) {
    if (entry.state !== 'ready' && entry.fade === 0) continue;
    entry.fade = Math.min(1, entry.fade + dt / 0.25);
    entry.material.uniforms.uOpacity.value = entry.fade;
    entry.material.uniforms.uBright.value = bright[i];
  }
  if (!S.tween && (S.mode === 'inside' || S.mode === 'flat')) {
    const hit = hitCloth(0, 0);
    const px = innerHeight / (2 * Math.tan((camera.fov * Math.PI) / 360) * (hit ? hit.t : 60));
    const weave = clamp(1 - (px - 24) / 60, 0, 1);
    clothUniforms.uWeave.value = weave;
    if (S.mode === 'flat') S.weaveFlat = weave;
  }
  backLines.material.opacity = S.back * 0.22;
  backLines.visible = S.back > 0.01 && backCentre !== null;
  backHot.visible = S.mode === 'outside' && hoverBack >= 0;
  if ((readClock += dt) > 0.15) { readClock = 0; readout(); }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
$('veil').classList.add('gone');
</script>
